# Working papers, grouped by theme. "status" is optional
# (e.g. Under review, Revise and resubmit). When a paper is published,
# delete it here and add it to the top of _data/publications.yml.

- theme: Election reform and representation
  papers:
    - title: "Whose (Provisional) Vote Counts? Voter Identification Requirements, Provisional Voting, and Ballot Rejection Rates in American Counties"
